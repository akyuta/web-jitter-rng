<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Jitter RNG Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <div class="container">
            <header>
                <h1>Web Jitter RNG</h1>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Browser-based True Random Number Generator
                </p>
            </header>

            <!-- Random Number Generator Section -->
            <section class="generator-section">
                <h2>Random Number Generator</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label for="input-digits">Digits (1-256)</label>
                        <input type="number" id="input-digits" min="1" max="256" value="32">
                    </div>
                    <div class="input-group">
                        <label for="select-format">Format</label>
                        <select id="select-format">
                            <option value="hex">Hexadecimal</option>
                            <option value="dec">Decimal</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="input-count">Count (1-100)</label>
                        <input type="number" id="input-count" min="1" max="100" value="1">
                    </div>
                </div>
                <div class="controls">
                    <button id="btn-generate">Generate</button>
                </div>
                <div class="output-section" id="generator-output">
                    <div class="output-header">
                        <span class="output-title">Generated Results</span>
                        <span class="output-title" id="result-count">0 items</span>
                    </div>
                    <pre id="output-results">Click "Generate" to start...</pre>
                </div>
            </section>

            <!-- Quality Test Section -->
            <section class="quality-test-section">
                <h2>Quality Tests (NIST SP 800-22)</h2>
                <div class="controls">
                    <button id="btn-quality-test">Run Quality Tests</button>
                </div>
                <div class="progress-container" id="progress-container" style="display: none;">
                    <div class="progress-info">
                        <span id="progress-text">0 / 7 tests completed</span>
                    </div>
                    <progress id="progress-bar" value="0" max="7"></progress>
                </div>
                <div class="test-results" id="test-results" style="display: none;">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Test Name</th>
                                <th>P-Value</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="test-results-body">
                            <!-- Results will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
